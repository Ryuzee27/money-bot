<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💰 Money Bot - Premium</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        :root {
            --bg: #f0f4ff;
            --card: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #555;
            --border: #e8edf5;
            --shadow: 0 20px 60px rgba(102, 126, 234, 0.15);
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass: rgba(255, 255, 255, 0.7);
            --input-bg: #f8faff;
            --hover: #f0f4ff;
            --radius: 20px;
            --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg: #0f0e1a;
            --card: #1a1a2e;
            --text: #f0f0ff;
            --text-secondary: #b0b0cc;
            --border: #2a2a44;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            --glass: rgba(26, 26, 46, 0.8);
            --input-bg: #22223a;
            --hover: #2a2a44;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            transition: background var(--transition), color var(--transition);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--border);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
        }

        .container {
            max-width: 880px;
            width: 100%;
            background: var(--card);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow);
            transition: background var(--transition), box-shadow var(--transition);
            position: relative;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            font-size: 2em;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header h1 {
            font-size: 1.7em;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Toggle Dark Mode */
        .toggle-dark {
            background: var(--border);
            border: none;
            width: 48px;
            height: 26px;
            border-radius: 30px;
            cursor: pointer;
            position: relative;
            transition: background var(--transition);
            flex-shrink: 0;
        }

        .toggle-dark .thumb {
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: transform var(--transition), background var(--transition);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        [data-theme="dark"] .toggle-dark {
            background: #667eea;
        }

        [data-theme="dark"] .toggle-dark .thumb {
            transform: translateX(22px);
            background: #1a1a2e;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9em;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Saldo Card */
        .saldo-card {
            background: var(--gradient);
            border-radius: var(--radius);
            padding: 28px 32px;
            color: white;
            margin-bottom: 28px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .saldo-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }

        .saldo-card::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -10%;
            width: 150px;
            height: 150px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
        }

        .saldo-card .label {
            font-size: 0.85em;
            opacity: 0.85;
            font-weight: 400;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 1;
        }

        .saldo-card .nominal {
            font-size: 3em;
            font-weight: 800;
            margin: 6px 0 4px;
            position: relative;
            z-index: 1;
            letter-spacing: -1px;
        }

        .saldo-card .saldo-detail {
            display: flex;
            gap: 24px;
            margin-top: 14px;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .saldo-card .saldo-detail span {
            font-size: 0.85em;
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .saldo-card .saldo-detail .plus {
            color: #7dffb3;
        }
        .saldo-card .saldo-detail .minus {
            color: #ff7d7d;
        }

        /* Form */
        .form-wrapper {
            background: var(--input-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            transition: background var(--transition), border var(--transition);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 12px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 0.75em;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select {
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 0.95em;
            background: var(--card);
            color: var(--text);
            transition: all var(--transition);
            width: 100%;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        .form-group input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .btn-primary {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95em;
            background: var(--gradient);
            color: white;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            white-space: nowrap;
            height: 48px;
            align-self: end;
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .toolbar-left {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .toolbar select {
            padding: 8px 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--card);
            color: var(--text);
            font-size: 0.9em;
            cursor: pointer;
            outline: none;
            transition: border var(--transition);
        }

        .toolbar select:focus {
            border-color: #667eea;
        }

        .btn-export {
            padding: 8px 18px;
            border: none;
            border-radius: 10px;
            background: #2ecc71;
            color: white;
            font-weight: 600;
            font-size: 0.85em;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-export:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.35);
        }

        /* Riwayat */
        .riwayat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .riwayat-header h3 {
            font-size: 1.15em;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .riwayat-header .count {
            font-size: 0.8em;
            font-weight: 400;
            color: var(--text-secondary);
            background: var(--border);
            padding: 2px 12px;
            border-radius: 20px;
        }

        .list-transaksi {
            max-height: 420px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .transaksi-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: var(--input-bg);
            border-radius: 14px;
            margin-bottom: 8px;
            transition: all var(--transition);
            border-left: 4px solid #667eea;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .transaksi-item:hover {
            background: var(--hover);
            transform: translateX(4px);
        }

        .transaksi-item.pemasukan {
            border-left-color: #2ecc71;
        }

        .transaksi-item.pengeluaran {
            border-left-color: #ff4757;
        }

        .transaksi-info {
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
        }

        .transaksi-info .deskripsi {
            font-weight: 600;
            font-size: 0.95em;
        }

        .transaksi-badge {
            font-size: 0.7em;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 30px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .transaksi-badge.pemasukan {
            background: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
        }

        .transaksi-badge.pengeluaran {
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
        }

        .transaksi-tanggal {
            color: var(--text-secondary);
            font-size: 0.78em;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .transaksi-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .transaksi-nominal {
            font-weight: 700;
            font-size: 1.05em;
        }

        .transaksi-nominal.plus {
            color: #2ecc71;
        }
        .transaksi-nominal.minus {
            color: #ff4757;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1em;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all var(--transition);
            opacity: 0.5;
        }

        .btn-delete:hover {
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
            opacity: 1;
            transform: scale(1.1);
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-secondary);
        }

        .empty i {
            font-size: 3em;
            opacity: 0.3;
            margin-bottom: 12px;
            display: block;
        }

        /* Statistik bawah */
        .statistik {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 2px solid var(--border);
            flex-wrap: wrap;
            gap: 12px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        .stat-item strong {
            color: var(--text);
        }

        .stat-item .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.green {
            background: #2ecc71;
        }
        .dot.red {
            background: #ff4757;
        }

        /* Responsive */
        @media (max-width: 700px) {
            .container {
                padding: 18px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .btn-primary {
                height: 44px;
                width: 100%;
            }
            .saldo-card .nominal {
                font-size: 2.2em;
            }
            .transaksi-item {
                flex-wrap: wrap;
                gap: 8px;
            }
            .transaksi-info {
                width: 100%;
            }
            .transaksi-right {
                width: 100%;
                justify-content: space-between;
            }
            .header h1 {
                font-size: 1.3em;
            }
            .saldo-card {
                padding: 20px;
            }
        }

        @media (max-width: 450px) {
            .saldo-card .saldo-detail {
                flex-direction: column;
                gap: 4px;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar-left {
                flex-wrap: wrap;
            }
            .toolbar select {
                flex: 1;
                min-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <span class="logo">💰</span>
                <h1>Money Bot</h1>
            </div>
            <div class="header-actions">
                <button class="toggle-dark" onclick="toggleTheme()" aria-label="Toggle Dark Mode">
                    <span class="thumb" id="themeIcon">🌙</span>
                </button>
            </div>
        </div>
        <div class="subtitle">
            <span>📊 Kelola keuangan dengan mudah &amp; cerdas</span>
            <span style="opacity:0.5;">|</span>
            <span id="lastUpdate" style="font-size:0.8em;"></span>
        </div>

        <!-- Saldo Card -->
        <div class="saldo-card">
            <div class="label"><i class="fas fa-wallet"></i> Total Saldo</div>
            <div class="nominal" id="totalSaldo">Rp 0</div>
            <div class="saldo-detail">
                <span><i class="fas fa-arrow-up plus"></i> Pemasukan: <strong id="totalPemasukan">Rp 0</strong></span>
                <span><i class="fas fa-arrow-down minus"></i> Pengeluaran: <strong id="totalPengeluaran">Rp 0</strong></span>
                <span><i class="fas fa-clock"></i> Transaksi: <strong id="jumlahTransaksiHeader">0</strong></span>
            </div>
        </div>

        <!-- Form -->
        <div class="form-wrapper">
            <div class="form-grid">
                <div class="form-group">
                    <label><i class="fas fa-pen"></i> Deskripsi</label>
                    <input type="text" id="deskripsi" placeholder="Misal: Gaji, Makan..." />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-coins"></i> Nominal</label>
                    <input type="number" id="nominal" placeholder="0" min="0" />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-tag"></i> Jenis</label>
                    <select id="jenis">
                        <option value="pemasukan">📈 Pemasukan</option>
                        <option value="pengeluaran">📉 Pengeluaran</option>
                    </select>
                </div>
                <button class="btn-primary" onclick="tambahTransaksi()">
                    <i class="fas fa-plus"></i> Tambah
                </button>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-left">
                <select id="filterJenis" onchange="renderRiwayat()">
                    <option value="semua">📋 Semua</option>
                    <option value="pemasukan">📈 Pemasukan</option>
                    <option value="pengeluaran">📉 Pengeluaran</option>
                </select>
                <button class="btn-export" onclick="exportCSV()">
                    <i class="fas fa-download"></i> CSV
                </button>
            </div>
            <span style="font-size:0.8em;color:var(--text-secondary);">
                <i class="fas fa-database"></i> <span id="totalItems">0</span> item
            </span>
        </div>

        <!-- Riwayat -->
        <div class="riwayat-header">
            <h3><i class="fas fa-list-ul"></i> Riwayat Transaksi</h3>
            <span class="count" id="countBadge">0 transaksi</span>
        </div>
        <div class="list-transaksi" id="daftarTransaksi">
            <div class="empty">
                <i class="fas fa-inbox"></i>
                Belum ada transaksi. Mulai catat sekarang!
            </div>
        </div>

        <!-- Statistik bawah -->
        <div class="statistik">
            <span class="stat-item">
                <span class="dot green"></span>
                Pemasukan: <strong id="statPemasukan">Rp 0</strong>
            </span>
            <span class="stat-item">
                <span class="dot red"></span>
                Pengeluaran: <strong id="statPengeluaran">Rp 0</strong>
            </span>
            <span class="stat-item">
                <i class="fas fa-arrows-left-right"></i>
                Selisih: <strong id="statSelisih">Rp 0</strong>
            </span>
        </div>
    </div>

    <script>
        // ========== DATA ==========
        let transaksi = [];

        // ========== LOAD / SAVE ==========
        function loadData() {
            const saved = localStorage.getItem('moneyBotData');
            if (saved) {
                try { transaksi = JSON.parse(saved); } catch (e) { transaksi = []; }
            }
        }

        function saveData() {
            localStorage.setItem('moneyBotData', JSON.stringify(transaksi));
        }

        // ========== FORMAT ==========
        function formatRupiah(angka) {
            return 'Rp ' + Number(angka).toLocaleString('id-ID');
        }

        // ========== THEME ==========
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('moneyBotTheme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeIcon');
            icon.textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        function loadTheme() {
            const saved = localStorage.getItem('moneyBotTheme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
                updateThemeIcon(saved);
            } else {
                // Default: cek preferensi sistem
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    updateThemeIcon('dark');
                }
            }
        }

        // ========== RENDER ==========
        function renderRiwayat() {
            const filter = document.getElementById('filterJenis').value;
            let filtered = transaksi;

            if (filter !== 'semua') {
                filtered = transaksi.filter(t => t.jenis === filter);
            }

            filtered = [...filtered].sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

            const container = document.getElementById('daftarTransaksi');
            const countBadge = document.getElementById('countBadge');
            const totalItems = document.getElementById('totalItems');

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <i class="fas fa-inbox"></i>
                        ${transaksi.length === 0 ? 'Belum ada transaksi. Mulai catat sekarang!' : 'Tidak ada transaksi dengan filter ini'}
                    </div>
                `;
                countBadge.textContent = '0 transaksi';
                totalItems.textContent = '0';
            } else {
                let html = '';
                filtered.forEach((t, index) => {
                    const jenisClass = t.jenis === 'pemasukan' ? 'pemasukan' : 'pengeluaran';
                    const nominalClass = t.jenis === 'pemasukan' ? 'plus' : 'minus';
                    const sign = t.jenis === 'pemasukan' ? '+' : '−';
                    const tanggal = new Date(t.tanggal);
                    const tanggalStr = tanggal.toLocaleDateString('id-ID', {
                        day: 'numeric',
                        month: 'short',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    html += `
                        <div class="transaksi-item ${jenisClass}">
                            <div class="transaksi-info">
                                <span class="deskripsi">${t.deskripsi}</span>
                                <span class="transaksi-badge ${jenisClass}">${t.jenis === 'pemasukan' ? '📈 Masuk' : '📉 Keluar'}</span>
                                <span class="transaksi-tanggal"><i class="far fa-clock"></i> ${tanggalStr}</span>
                            </div>
                            <div class="transaksi-right">
                                <span class="transaksi-nominal ${nominalClass}">${sign} ${formatRupiah(t.nominal)}</span>
                                <button class="btn-delete" onclick="hapusTransaksi(${index})" title="Hapus">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
                countBadge.textContent = filtered.length + ' transaksi';
                totalItems.textContent = filtered.length;
            }

            // Update statistik
            updateStatistik();
            updateSaldo();
            document.getElementById('totalItems').textContent = filtered.length;
        }

        // ========== UPDATE SALDO ==========
        function updateSaldo() {
            const total = transaksi.reduce((sum, t) => {
                return t.jenis === 'pemasukan' ? sum + t.nominal : sum - t.nominal;
            }, 0);
            document.getElementById('totalSaldo').textContent = formatRupiah(total);
        }

        // ========== UPDATE STATISTIK ==========
        function updateStatistik() {
            const totalMasuk = transaksi.filter(t => t.jenis === 'pemasukan').reduce((s, t) => s + t.nominal, 0);
            const totalKeluar = transaksi.filter(t => t.jenis === 'pengeluaran').reduce((s, t) => s + t.nominal, 0);
            const selisih = totalMasuk - totalKeluar;

            document.getElementById('totalPemasukan').textContent = formatRupiah(totalMasuk);
            document.getElementById('totalPengeluaran').textContent = formatRupiah(totalKeluar);
            document.getElementById('jumlahTransaksiHeader').textContent = transaksi.length;
            document.getElementById('statPemasukan').textContent = formatRupiah(totalMasuk);
            document.getElementById('statPengeluaran').textContent = formatRupiah(totalKeluar);
            document.getElementById('statSelisih').textContent = formatRupiah(selisih);

            // Last update
            const now = new Date();
            document.getElementById('lastUpdate').textContent = '🔄 ' + now.toLocaleTimeString('id-ID', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // ========== TAMBAH TRANSAKSI ==========
        function tambahTransaksi() {
            const deskripsi = document.getElementById('deskripsi').value.trim();
            const nominal = parseFloat(document.getElementById('nominal').value);
            const jenis = document.getElementById('jenis').value;

            if (!deskripsi) {
                alert('⚠️ Mohon isi deskripsi!');
                document.getElementById('deskripsi').focus();
                return;
            }

            if (!nominal || nominal <= 0) {
                alert('⚠️ Mohon isi nominal yang valid!');
                document.getElementById('nominal').focus();
                return;
            }

            const newTransaksi = {
                id: Date.now(),
                deskripsi: deskripsi,
                nominal: nominal,
                jenis: jenis,
                tanggal: new Date().toISOString()
            };

            transaksi.push(newTransaksi);
            saveData();
            renderRiwayat();

            // Reset form
            document.getElementById('deskripsi').value = '';
            document.getElementById('nominal').value = '';
            document.getElementById('deskripsi').focus();

            // Feedback
            const btn = document.querySelector('.btn-primary');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> Berhasil!';
            btn.style.transform = 'scale(0.97)';
            setTimeout(() => {
                btn.innerHTML = originalHtml;
                btn.style.transform = '';
            }, 1200);
        }

        // ========== HAPUS TRANSAKSI ==========
        function hapusTransaksi(index) {
            const filter = document.getElementById('filterJenis').value;
            let filtered = transaksi;
            if (filter !== 'semua') {
                filtered = transaksi.filter(t => t.jenis === filter);
            }
            filtered = [...filtered].sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

            if (index >= 0 && index < filtered.length) {
                const targetId = filtered[index].id;
                if (confirm('🗑️ Hapus transaksi ini?')) {
                    transaksi = transaksi.filter(t => t.id !== targetId);
                    saveData();
                    renderRiwayat();
                }
            }
        }

        // ========== EXPORT CSV ==========
        function exportCSV() {
            if (transaksi.length === 0) {
                alert('📭 Belum ada transaksi untuk diexport!');
                return;
            }

            let csv = 'Tanggal,Deskripsi,Jenis,Nominal (Rp)\n';
            transaksi.forEach(t => {
                const tanggal = new Date(t.tanggal).toLocaleDateString('id-ID');
                csv += `${tanggal},${t.deskripsi},${t.jenis},${t.nominal}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `moneybot_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        // ========== KEYBOARD SHORTCUT ==========
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const active = document.activeElement;
                if (active.id === 'deskripsi' || active.id === 'nominal') {
                    e.preventDefault();
                    tambahTransaksi();
                }
            }
        });

        // ========== INIT ==========
        loadTheme();
        loadData();
        renderRiwayat();
    </script>
</body>
</html>
